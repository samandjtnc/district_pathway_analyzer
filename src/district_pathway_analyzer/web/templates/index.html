<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>District Pathway Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #F7F8FA;
            min-height: 100vh;
            color: #292F36;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            padding: 3rem 0 2rem;
            background: #0093A4;
            color: white;
            box-shadow: 0 2px 8px rgba(0, 147, 164, 0.15);
        }

        header h1 {
            font-family: 'Barlow Semi Condensed', sans-serif;
            font-size: 48px;
            font-weight: 600;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        header p {
            font-size: 20px;
            font-weight: 400;
            opacity: 0.95;
        }

        .card {
            background: #FFFFFF;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(41, 47, 54, 0.08);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .card h2 {
            font-family: 'Barlow Semi Condensed', sans-serif;
            color: #292F36;
            margin-bottom: 1.5rem;
            font-size: 32px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #292F36;
        }

        .form-group input[type="text"],
        .form-group select {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Figtree', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input[type="text"]:focus,
        .form-group select:focus {
            outline: none;
            border-color: #0093A4;
            box-shadow: 0 0 0 3px rgba(0, 147, 164, 0.1);
        }

        .file-upload {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #F7F8FA;
        }

        .file-upload:hover {
            border-color: #0093A4;
            background: rgba(0, 147, 164, 0.05);
        }

        .file-upload.has-file {
            border-color: #0093A4;
            background: rgba(0, 147, 164, 0.1);
        }

        .file-upload input[type="file"] {
            display: none;
        }

        .file-upload-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .file-upload-text {
            color: #666;
        }

        .file-name {
            margin-top: 0.5rem;
            font-weight: 600;
            color: #0093A4;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #0093A4;
            color: white;
            width: 100%;
            font-family: 'Figtree', sans-serif;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #007A89;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 147, 164, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Progress Section */
        .progress-section {
            display: none;
        }

        .progress-section.active {
            display: block;
        }

        .progress-bar-container {
            background: #e0e0e0;
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(135deg, #0093A4 0%, #00FFF5 100%);
            border-radius: 10px;
            transition: width 0.3s ease;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .progress-text {
            text-align: center;
            color: #666;
            font-size: 0.95rem;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #e0e0e0;
            border-top-color: #0093A4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Results Section */
        .results-section {
            display: none;
        }

        .results-section.active {
            display: block;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .status-badge.success {
            background: rgba(0, 147, 164, 0.15);
            color: #0093A4;
        }

        .status-badge.failed {
            background: rgba(237, 96, 96, 0.15);
            color: #ED6060;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin: 1.5rem 0;
        }

        .stat-card {
            background: #F7F8FA;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 1.25rem;
        }

        .stat-card .label {
            font-size: 0.875rem;
            color: #64748b;
            margin-bottom: 0.5rem;
            font-weight: 400;
        }

        .stat-card .value {
            font-size: 1.25rem;
            font-weight: 600;
            color: #292F36;
            font-family: 'Barlow Semi Condensed', sans-serif;
        }

        .section-title {
            font-family: 'Barlow Semi Condensed', sans-serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: #292F36;
            margin: 1.5rem 0 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #0093A4;
        }

        .narrative-box {
            background: #F7F8FA;
            border-left: 4px solid #0093A4;
            padding: 1rem 1.25rem;
            border-radius: 0 8px 8px 0;
            margin: 1rem 0;
            line-height: 1.6;
            color: #292F36;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 0.5rem 0;
        }

        .tag {
            background: rgba(0, 147, 164, 0.15);
            color: #0093A4;
            padding: 0.375rem 0.75rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .tag.opportunity {
            background: rgba(140, 82, 186, 0.15);
            color: #8C52BA;
        }

        .tag.risk {
            background: rgba(237, 96, 96, 0.15);
            color: #ED6060;
        }

        .course-table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }

        .course-table th,
        .course-table td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        .course-table th {
            background: #F7F8FA;
            font-family: 'Barlow Semi Condensed', sans-serif;
            font-weight: 600;
            color: #292F36;
            font-size: 0.875rem;
        }

        .course-table tr:hover {
            background: #F7F8FA;
        }

        .recommendation-card {
            background: rgba(140, 82, 186, 0.05);
            border: 2px solid rgba(140, 82, 186, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            margin: 1rem 0;
        }

        .recommendation-card h4 {
            font-family: 'Barlow Semi Condensed', sans-serif;
            color: #8C52BA;
            margin-bottom: 0.75rem;
            font-size: 1.25rem;
        }

        .confidence-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .confidence-badge.high {
            background: rgba(0, 147, 164, 0.2);
            color: #0093A4;
        }

        .confidence-badge.medium {
            background: rgba(140, 82, 186, 0.2);
            color: #8C52BA;
        }

        .confidence-badge.low {
            background: rgba(237, 96, 96, 0.2);
            color: #ED6060;
        }

        .error-box {
            background: rgba(237, 96, 96, 0.1);
            border: 1px solid rgba(237, 96, 96, 0.3);
            border-radius: 8px;
            padding: 1rem;
            color: #ED6060;
            margin: 1rem 0;
        }

        .warning-box {
            background: rgba(140, 82, 186, 0.1);
            border: 1px solid rgba(140, 82, 186, 0.3);
            border-radius: 8px;
            padding: 1rem;
            color: #8C52BA;
            margin: 1rem 0;
        }

        .reset-btn {
            background: #F7F8FA;
            color: #292F36;
            padding: 0.875rem 1.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Figtree', sans-serif;
            font-weight: 600;
            font-size: 16px;
            margin-top: 1rem;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            background: #FFFFFF;
            border-color: #0093A4;
            color: #0093A4;
        }

        .download-btn {
            background: #0093A4;
            color: white;
            padding: 0.875rem 1.75rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Figtree', sans-serif;
            font-weight: 600;
            font-size: 16px;
            margin-top: 1rem;
            margin-right: 1rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .download-btn:hover {
            background: #007A89;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 147, 164, 0.3);
        }

        .download-btn-comparison {
            background: #8C52BA;
            color: white;
            padding: 0.875rem 1.75rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Figtree', sans-serif;
            font-weight: 600;
            font-size: 16px;
            margin-top: 1rem;
            margin-right: 1rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .download-btn-comparison:hover {
            background: #7640A3;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(140, 82, 186, 0.3);
        }

        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        footer {
            text-align: center;
            padding: 2rem;
            background: #292F36;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.875rem;
            margin-top: 3rem;
        }

        footer a {
            color: #00FFF5;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        footer a:hover {
            color: #0093A4;
        }

        .version-badge {
            display: inline-block;
            background: rgba(0, 147, 164, 0.2);
            color: #00FFF5;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            margin-top: 0.5rem;
            font-family: 'Courier New', monospace;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            header h1 {
                font-size: 1.75rem;
            }

            .card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>District Pathway Analyzer</h1>
            <p>AI-Powered CTE Pathway Analysis for AI Foundations Integration</p>
        </header>

        <!-- Input Form -->
        <div class="card" id="input-section">
            <h2>Analyze a District</h2>
            <form id="analysis-form">
                <div class="form-group">
                    <label for="district_name">District Name</label>
                    <input type="text" id="district_name" name="district_name"
                           placeholder="e.g., Johnston County Schools" required>
                </div>

                <div class="form-group">
                    <label for="state">State</label>
                    <input type="text" id="state" name="state"
                           placeholder="e.g., North Carolina or NC" required>
                </div>

                <div class="form-group">
                    <label>Course Catalog Document (PDF)</label>
                    <div class="file-upload" id="file-upload">
                        <input type="file" id="document" name="document" accept=".pdf,.html,.htm">
                        <div class="file-upload-icon">📄</div>
                        <div class="file-upload-text">
                            Click or drag to upload a CTE course catalog
                        </div>
                        <div class="file-name" id="file-name"></div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="submit-btn">
                    Analyze District
                </button>
            </form>
        </div>

        <!-- Progress Section -->
        <div class="card progress-section" id="progress-section">
            <h2><span class="spinner"></span> Analysis in Progress</h2>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar" style="width: 30%"></div>
            </div>
            <p class="progress-text" id="progress-text">Starting analysis...</p>
        </div>

        <!-- Results Section -->
        <div class="results-section" id="results-section">
            <!-- Results will be dynamically populated -->
        </div>
    </div>

    <footer>
        <p>Powered by <a href="https://code.org" target="_blank">Code.org</a> |
           <a href="https://github.com/code-dot-org" target="_blank">View on GitHub</a></p>
        <div class="version-badge">v2.1.0 • AI Descriptions + Semantic Keywords</div>
    </footer>

    <script>
        // State management
        let currentJobId = null;
        let pollInterval = null;

        // DOM Elements
        const form = document.getElementById('analysis-form');
        const inputSection = document.getElementById('input-section');
        const progressSection = document.getElementById('progress-section');
        const resultsSection = document.getElementById('results-section');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const submitBtn = document.getElementById('submit-btn');
        const fileUpload = document.getElementById('file-upload');
        const fileInput = document.getElementById('document');
        const fileName = document.getElementById('file-name');

        // File upload handling
        fileUpload.addEventListener('click', () => fileInput.click());
        fileUpload.addEventListener('dragover', (e) => {
            e.preventDefault();
            fileUpload.style.borderColor = '#0093A4';
        });
        fileUpload.addEventListener('dragleave', () => {
            fileUpload.style.borderColor = '#ccc';
        });
        fileUpload.addEventListener('drop', (e) => {
            e.preventDefault();
            fileUpload.style.borderColor = '#ccc';
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                updateFileName();
            }
        });
        fileInput.addEventListener('change', updateFileName);

        function updateFileName() {
            if (fileInput.files.length) {
                fileName.textContent = fileInput.files[0].name;
                fileUpload.classList.add('has-file');
            } else {
                fileName.textContent = '';
                fileUpload.classList.remove('has-file');
            }
        }

        // Form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(form);

            try {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner"></span> Starting...';

                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('Failed to start analysis');
                }

                const data = await response.json();
                currentJobId = data.job_id;

                // Show progress section
                inputSection.style.display = 'none';
                progressSection.classList.add('active');
                resultsSection.classList.remove('active');

                // Start polling for status
                startPolling();

            } catch (error) {
                console.error('Error:', error);
                alert('Failed to start analysis: ' + error.message);
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Analyze District';
            }
        });

        function startPolling() {
            pollInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/status/${currentJobId}`);
                    const data = await response.json();

                    progressText.textContent = data.progress;

                    if (data.status === 'running') {
                        progressBar.style.width = '60%';
                    } else if (data.status === 'completed') {
                        progressBar.style.width = '100%';
                        clearInterval(pollInterval);
                        setTimeout(() => showResults(data.result), 500);
                    } else if (data.status === 'failed') {
                        clearInterval(pollInterval);
                        showError(data.error);
                    }
                } catch (error) {
                    console.error('Polling error:', error);
                }
            }, 1000);
        }

        function showResults(result) {
            progressSection.classList.remove('active');
            resultsSection.classList.add('active');
            resultsSection.innerHTML = renderResults(result);
        }

        function showError(error) {
            progressSection.classList.remove('active');
            resultsSection.classList.add('active');
            resultsSection.innerHTML = `
                <div class="card">
                    <h2>Analysis Failed</h2>
                    <div class="error-box">
                        <strong>Error:</strong> ${error}
                    </div>
                    <button class="reset-btn" onclick="resetForm()">Try Again</button>
                </div>
            `;
        }

        function renderResults(result) {
            const isSuccess = result.pipeline_status === 'success';

            let html = `
                <div class="card">
                    <h2>
                        Analysis Results: ${result.district_name}, ${result.state}
                        <span class="status-badge ${isSuccess ? 'success' : 'failed'}">
                            ${isSuccess ? '✓ Complete' : '✗ Incomplete'}
                        </span>
                    </h2>
            `;

            if (result.errors && result.errors.length > 0) {
                html += `<div class="error-box"><strong>Errors:</strong><ul>`;
                result.errors.forEach(err => {
                    html += `<li>${err}</li>`;
                });
                html += `</ul></div>`;
            }

            if (result.warnings && result.warnings.length > 0) {
                html += `<div class="warning-box"><strong>Warnings:</strong><ul>`;
                result.warnings.forEach(warn => {
                    html += `<li>${warn.substring(0, 200)}...</li>`;
                });
                html += `</ul></div>`;
            }

            if (result.landscape) {
                html += `
                    <div class="result-grid">
                        <div class="stat-card">
                            <div class="label">Courses Found</div>
                            <div class="value">${result.landscape.course_count}</div>
                        </div>
                        <div class="stat-card">
                            <div class="label">Pathway Shape</div>
                            <div class="value">${formatValue(result.landscape.pathway_shape)}</div>
                        </div>
                        <div class="stat-card">
                            <div class="label">Entry Point</div>
                            <div class="value">${result.landscape.entry_point.course || 'Not identified'}</div>
                        </div>
                        <div class="stat-card">
                            <div class="label">Domain Coverage</div>
                            <div class="value">${formatValue(result.landscape.domain_coverage.pattern)}</div>
                        </div>
                    </div>

                    <h3 class="section-title">Landscape Summary</h3>
                    <div class="narrative-box">${result.landscape.landscape_summary}</div>

                    <h3 class="section-title">Identified Pathways</h3>
                    <div class="tag-list">
                        ${result.landscape.identified_pathways.map(p => `<span class="tag">${p}</span>`).join('')}
                    </div>
                `;
            }

            if (result.alignment) {
                html += `
                    <h3 class="section-title">Alignment Analysis</h3>
                    <div class="narrative-box">${result.alignment.narrative}</div>

                    <div class="result-grid">
                        <div class="stat-card">
                            <div class="label">Entry Timing</div>
                            <div class="value">${formatValue(result.alignment.profile.entry_timing)}</div>
                        </div>
                        <div class="stat-card">
                            <div class="label">Specialization</div>
                            <div class="value">${formatValue(result.alignment.profile.specialization)}</div>
                        </div>
                        <div class="stat-card">
                            <div class="label">Coherence</div>
                            <div class="value">${formatValue(result.alignment.profile.coherence)}</div>
                        </div>
                        <div class="stat-card">
                            <div class="label">AI Integration</div>
                            <div class="value">${formatValue(result.alignment.profile.ai_integration)}</div>
                        </div>
                    </div>

                    <h4 style="margin-top: 1rem; color: #166534;">Opportunities</h4>
                    <div class="tag-list">
                        ${result.alignment.opportunities.map(o => `<span class="tag opportunity">${o}</span>`).join('')}
                    </div>

                    ${result.alignment.risks.length > 0 ? `
                        <h4 style="margin-top: 1rem; color: #92400e;">Risk Considerations</h4>
                        <div class="tag-list">
                            ${result.alignment.risks.map(r => `<span class="tag risk">${r}</span>`).join('')}
                        </div>
                    ` : ''}
                `;
            }

            if (result.design) {
                html += `
                    <h3 class="section-title">Recommended Strategy</h3>
                    <div class="recommendation-card">
                        <h4>
                            ${formatValue(result.design.strategy)}
                            <span class="confidence-badge ${result.design.confidence}">${result.design.confidence}</span>
                        </h4>
                        <p><strong>AI Foundations Role:</strong> ${formatValue(result.design.role)}</p>
                        ${result.design.existing_course ? `<p><strong>Align with:</strong> ${result.design.existing_course}</p>` : ''}
                        <div class="narrative-box" style="margin-top: 1rem; background: white;">
                            ${result.design.narrative}
                        </div>
                    </div>

                    <div class="result-grid">
                        <div class="stat-card">
                            <div class="label">Grade Band</div>
                            <div class="value">${result.design.variables.grade_band}</div>
                        </div>
                        <div class="stat-card">
                            <div class="label">Credit Framing</div>
                            <div class="value">${result.design.variables.credit_framing}</div>
                        </div>
                        <div class="stat-card">
                            <div class="label">Entry Strength</div>
                            <div class="value">${formatValue(result.design.variables.entry_strength)}</div>
                        </div>
                    </div>

                    ${result.design.downstream_pathways.length > 0 ? `
                        <h3 class="section-title">Downstream Pathway Connections</h3>
                        <table class="course-table">
                            <thead>
                                <tr>
                                    <th>Pathway</th>
                                    <th>Relationship</th>
                                    <th>Courses</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${result.design.downstream_pathways.map(dp => `
                                    <tr>
                                        <td>${dp.name}</td>
                                        <td>${formatValue(dp.relationship)}</td>
                                        <td>${dp.courses.slice(0, 3).join(', ')}${dp.courses.length > 3 ? '...' : ''}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    ` : ''}

                    ${result.design.assumptions.length > 0 ? `
                        <h4 style="margin-top: 1rem;">Assumptions</h4>
                        <ul style="margin-left: 1.5rem; color: #64748b;">
                            ${result.design.assumptions.map(a => `<li>${a}</li>`).join('')}
                        </ul>
                    ` : ''}
                `;
            }

            if (result.landscape && result.landscape.courses) {
                html += `
                    <h3 class="section-title">Course Inventory (${result.landscape.courses.length} courses)</h3>
                    <table class="course-table">
                        <thead>
                            <tr>
                                <th>Course Title</th>
                                <th>Domain</th>
                                <th>Role</th>
                                <th>Confidence</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${result.landscape.courses.map(c => `
                                <tr>
                                    <td>${c.title}</td>
                                    <td>${c.domain || '-'}</td>
                                    <td>${c.role ? formatValue(c.role) : '-'}</td>
                                    <td>${c.confidence}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            }

            html += `
                    <div class="action-buttons">
                        <a href="/api/download/${currentJobId}" class="download-btn" download>
                            <span>📄</span> Download Full Report (Markdown)
                        </a>
                        <a href="/api/view-comparison/${currentJobId}" class="download-btn-comparison" target="_blank">
                            <span>🔀</span> View Pathway Comparison
                        </a>
                        <button class="reset-btn" onclick="resetForm()">Analyze Another District</button>
                    </div>
                </div>
            `;

            return html;
        }

        function formatValue(value) {
            if (!value) return '-';
            return value
                .replace(/_/g, ' ')
                .replace(/\b\w/g, l => l.toUpperCase());
        }

        function resetForm() {
            currentJobId = null;
            if (pollInterval) clearInterval(pollInterval);

            form.reset();
            fileName.textContent = '';
            fileUpload.classList.remove('has-file');
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Analyze District';
            progressBar.style.width = '30%';

            inputSection.style.display = 'block';
            progressSection.classList.remove('active');
            resultsSection.classList.remove('active');
        }
    </script>
</body>
</html>
